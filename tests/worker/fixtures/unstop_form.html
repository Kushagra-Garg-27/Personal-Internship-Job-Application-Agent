<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unstop Application Form</title>
</head>
<body>
  <header>
    <h1>Software Engineering Fellowship</h1>
    <span class="org-name">Global Innovation Labs</span>
  </header>

  <main>
    <div class="registration-form">
      <h3>Registration Form</h3>
      <form id="reg-form">
        <div class="field-item">
          <label>Why do you want to apply for this opportunity?</label>
          <textarea name="statement_of_purpose" placeholder="Why do you want to join..." rows="5"></textarea>
        </div>

        <div class="field-item">
          <label>Upload Resume</label>
          <input type="file" name="user_resume" />
        </div>

        <div class="actions">
          <button type="button" id="unstop_submit" class="submit-btn">Complete Registration</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
