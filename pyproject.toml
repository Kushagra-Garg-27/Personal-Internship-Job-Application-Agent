[project]
name = "job-app-agent"
version = "0.5.0"
description = "Personal Job/Internship Application Agent — Career Intelligence Core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    # Phase 3: discovery
    "httpx>=0.27",
    "feedparser>=6.0",
    "APScheduler>=3.10,<4",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
    "beautifulsoup4>=4.12",
    # Phase 4: relevance scoring
    "sentence-transformers>=2.2",
    "torch>=2.0",
    # Phase 5: scam/risk filter
    "google-genai>=1.0",
    "python-whois>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "respx>=0.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m \"not live_unstop\""
markers = [
    "live_unstop: live integration tests that hit the real Unstop website (skipped by default in offline CI)",
]
