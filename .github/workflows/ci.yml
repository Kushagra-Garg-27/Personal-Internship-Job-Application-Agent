# CI for the Personal Internship/Job Application Agent (Phases 1–10).
#
# Runs the authoritative quality gates on every push to `main` and every
# pull request:
#   - Backend: complete pytest suite (462 tests as of Phase 10)
#   - Frontend: oxlint, vitest suite, and production build (tsc -b && vite build)
#
# No job requires Gmail, Telegram, WhatsApp, Greenhouse, Lever, Internshala,
# Unstop, Gemini, or any other production credential — external services are
# mocked inside the tests. The only downloads performed are the CPU-only
# PyTorch wheels, the local embedding model (all-MiniLM-L6-v2), and the
# Playwright Chromium browser used by the Internshala/Unstop adapter tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            worker/requirements.txt

      - name: Install CPU-only PyTorch
        # CI runners have no GPU; installing the CPU wheel avoids a ~2 GB
        # CUDA download while satisfying `torch>=2.0` from pyproject.toml.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend and worker dependencies
        # pyproject.toml provides the Core/API stack plus dev extras.
        # worker/requirements.txt provides Playwright + cryptography, which
        # tests/worker modules import at collection time.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r worker/requirements.txt

      - name: Cache HuggingFace embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      - name: Pre-download local embedding model
        # test_relevance.py and the scam-review approve flow load the
        # sentence-transformer model at runtime; pre-fetching keeps the
        # test run deterministic and avoids mid-test downloads.
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run backend test suite
        run: python -m pytest

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build